  <section class="wrap page-head">
    <a class="crumb" href="index.html">← 返回首页</a>
    <h1>小相册</h1>
    <p>都是手机随手拍的，不专业，但每一张背后都有一件小事。</p>
  </section>

  <!-- ---------- 第一组：校园 ---------- -->
  <section class="wrap">
    <h2 class="group-title"><i></i>校园里的光和路</h2>
    <p class="group-note">「走了那么远，我们去寻找一盏灯。」—— 顾城</p>

    <div class="masonry">
      <figure class="photo-card">
        <a class="zoom" href="images/campus-sunset.jpg" target="_blank" rel="noopener" title="点击查看大图"><img src="images/campus-sunset.jpg" alt="傍晚校园的天空、路灯和挂着的国旗" loading="lazy" width="1000" height="750"></a>
        <figcaption>
          <b>突然就变成这样了</b>
          下课回寝室的路上抬头看了一眼，天空是橘粉色的。
        </figcaption>
      </figure>

      <figure class="photo-card">
        <a class="zoom" href="images/campus-night.jpg" target="_blank" rel="noopener" title="点击查看大图"><img src="images/campus-night.jpg" alt="夜晚的图书馆，整栋楼灯火通明" loading="lazy" width="1000" height="562"></a>
        <figcaption>
          <b>图书馆的灯</b>
          晚上从操场边走过，整栋楼的窗子都亮着，像一群人还在里面悄悄较劲。
        </figcaption>
      </figure>

      <figure class="photo-card">
        <a class="zoom" href="images/night-road.jpg" target="_blank" rel="noopener" title="点击查看大图"><img src="images/night-road.jpg" alt="夜晚的梧桐大道，路边停满电动车" loading="lazy" width="750" height="1000"></a>
        <figcaption>
          <b>十点的梧桐道</b>
          路灯把树影拉得很长，整条路只有电动车的声音。
        </figcaption>
      </figure>

      <figure class="photo-card">
        <a class="zoom" href="images/campus-lawn.jpg" target="_blank" rel="noopener" title="点击查看大图"><img src="images/campus-lawn.jpg" alt="阳光下的校园草坪和教学楼" loading="lazy" width="1000" height="750"></a>
        <figcaption>
          <b>学校最好看的一块草坪</b>
          太阳大的时候，草坪绿得像自带滤镜。
        </figcaption>
      </figure>

      <figure class="photo-card">
        <a class="zoom" href="images/street-dusk.jpg" target="_blank" rel="noopener" title="点击查看大图"><img src="images/street-dusk.jpg" alt="黄昏时分小吃街人来人往" loading="lazy" width="1000" height="750"></a>
        <figcaption>
          <b>小吃街的黄昏</b>
          人挤人，但那种热闹特别有生活气。
        </figcaption>
      </figure>

      <figure class="photo-card">
        <a class="zoom" href="images/group-freshman.jpg" target="_blank" rel="noopener" title="点击查看大图"><img src="images/group-freshman.jpg" alt="学院学生在大红背景板前的集体合影" loading="lazy" width="1000" height="582"></a>
        <figcaption>
          <b>学院的大合影</b>
          那天风很大，院旗一直在飘，站了十分钟腿都麻了。
          为了保护同学的隐私，照片做了模糊处理。
        </figcaption>
      </figure>

      <figure class="photo-card">
        <a class="zoom" href="images/group-sports.jpg" target="_blank" rel="noopener" title="点击查看大图"><img src="images/group-sports.jpg" alt="七位同学在红色背景板前合影" loading="lazy" width="1000" height="750"></a>
        <figcaption>
          <b>趣味项目的队友</b>
          比赛结束，拉着队友在背景板前拍了一张——输赢早就忘了，只记得笑到肚子疼。
          为了保护同学的隐私，照片做了模糊处理。
        </figcaption>
      </figure>
    </div>
  </section>

  <!-- ---------- 第二组：武汉 ---------- -->
  <section class="wrap">
    <h2 class="group-title"><i></i>武汉的街头</h2>
    <p class="group-note">在这座城市长大，还是会为它的热闹停下来拍一张。</p>

    <div class="masonry">
      <figure class="photo-card">
        <a class="zoom" href="images/guanggu-pikachu.jpg" target="_blank" rel="noopener" title="点击查看大图"><img src="images/guanggu-pikachu.jpg" alt="光谷广场的皮卡丘雕塑和商场" loading="lazy" width="1000" height="750"></a>
        <figcaption>
          <b>光谷的皮卡丘</b>
          每次路过都想拍一张，这次终于拍了。
        </figcaption>
      </figure>

      <figure class="photo-card">
        <a class="zoom" href="images/guanggu-street.jpg" target="_blank" rel="noopener" title="点击查看大图"><img src="images/guanggu-street.jpg" alt="光谷步行街的牌坊和高楼" loading="lazy" width="1000" height="750"></a>
        <figcaption>
          <b>光谷步行街</b>
          从小逛到大的地方，节假日永远是这么多人。
        </figcaption>
      </figure>

      <figure class="photo-card">
        <a class="zoom" href="images/fruit-market.jpg" target="_blank" rel="noopener" title="点击查看大图"><img src="images/fruit-market.jpg" alt="夜市水果摊，灯光下的各色水果" loading="lazy" width="1000" height="562"></a>
        <figcaption>
          <b>水果摊</b>
          灯一亮，整个摊子像被打了一层暖光，很有烟火气。
        </figcaption>
      </figure>

      <figure class="photo-card">
        <a class="zoom" href="images/izakaya-shop.jpg" target="_blank" rel="noopener" title="点击查看大图"><img src="images/izakaya-shop.jpg" alt="一家日式小店的门面，招牌写着浅草料理" loading="lazy" width="1000" height="750"></a>
        <figcaption>
          <b>一家叫浅草料理的小店</b>
          门口的灯牌和木招牌很好看，下次想去吃。
        </figcaption>
      </figure>

      <figure class="photo-card">
        <a class="zoom" href="images/sign-squid.jpg" target="_blank" rel="noopener" title="点击查看大图"><img src="images/sign-squid.jpg" alt="红色大招牌写着高启强大鱿鱼" loading="lazy" width="1000" height="562"></a>
        <figcaption>
          <b>招牌太有梗了</b>
          「高启强大鱿鱼」，站在路边笑了三分钟。
        </figcaption>
      </figure>

      <figure class="photo-card">
        <a class="zoom" href="images/halloween-pumpkin.jpg" target="_blank" rel="noopener" title="点击查看大图"><img src="images/halloween-pumpkin.jpg" alt="深色桌布上放着一个发光的南瓜灯" loading="lazy" width="750" height="1000"></a>
        <figcaption>
          <b>万圣节的南瓜灯</b>
          那天晚上路过一家小店，桌上摆着这个，亮得刚刚好。
        </figcaption>
      </figure>

      <figure class="photo-card">
        <a class="zoom" href="images/street-sign.jpg" target="_blank" rel="noopener" title="点击查看大图"><img src="images/street-sign.jpg" alt="路牌上写着：你考武大，她考华科，我烤面包" loading="lazy" width="1000" height="750"></a>
        <figcaption>
          <b>路牌在讲段子</b>
          「你考武大，她考华科，我烤面包」，武汉的路牌很有幽默感。
        </figcaption>
      </figure>
    </div>
  </section>

    <div class="note" style="margin-top:44px;">
      <div>
        <strong>相册之外，我还有一个小世界</strong>
        <p class="sec-sub" style="margin:6px 0 0;">《龙族》、推理小说、偶尔的游戏和动漫，都在那一页。</p>
      </div>
      <a class="btn btn-main" href="world.html">去小世界</a>
    </div>
  </section>
